[workspace]
members = [
    "blockchain/block",
    "blockchain/state/*",
    "constants",
    "experiments/*",
    "fuzz",
    "jam-types",
    "jam-utils/bandersnatch-vrf-spec/vinwolf/",
    "jam-utils/codec",
    "jam-utils/grandpa",
    "jam-utils/misc",
    "jam-utils/serialization",
    "jam-utils/shuffle",
    "jam-utils/trie",
    "network", 
    "node",
    "pvm",
    "storage",
    "tests",
    "tools",
]
resolver = "2"


[workspace.package]
version = "0.1.0"
authors = ["Bernardo Lopez <bernar792@gmail.com>"]
license = "Apache-2.0"
edition = "2021"
repository = "https://github.com/bloppan/vinwolf"


[workspace.dependencies]
accumulation = { path = "blockchain/state/accumulation" }
authorization = { path = "blockchain/state/authorization" }
bandersnatch-vrf-spec = { package = "bandersnatch_vrf_spec", path = "jam-utils/bandersnatch-vrf-spec/vinwolf" }
block = { path = "blockchain/block" }
codec = { path = "jam-utils/codec" }
constants = { path = "constants" }
disputes = { path = "blockchain/state/disputes" }
grandpa = { path = "jam-utils/grandpa" }
entropy = { path = "blockchain/state/entropy" }
jam-types = { path = "jam-types" }
misc = { path = "jam-utils/misc" }
pvm = { path = "pvm" }
recent-history = { path = "blockchain/state/recent-history" }
reports = { path = "blockchain/state/reports" }
safrole = { path = "blockchain/state/safrole" }
serialization = { path = "jam-utils/serialization" }
services = { path = "blockchain/state/services" }
shuffle = { path = "jam-utils/shuffle" }
state-ctrl = { path = "blockchain/state/state-ctrl" }
state-handler = { path = "blockchain/state/state-handler" }
statistics = { path = "blockchain/state/statistics" }
storage = { path = "storage" }
time = { path = "blockchain/state/time" }
tools = { path = "tools" }
trie = { path = "jam-utils/trie" }
validators = { path = "blockchain/state/validators" }
vinwolf-target = { path = "fuzz" }

# Third party libraries
ark-vrf = { version = "0.1.0", features = ["bandersnatch", "ring"] }
quinn = { version = "0.11", features = ["rustls"] }
rocksdb = "0.24.0"
sp-core = "34.0.0"
tokio = { version = "1.40", features = ["full"] }
